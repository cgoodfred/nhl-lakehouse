# Parameterized rolling-window NHL bronze ingest.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ingest-window
  namespace: lakehouse
spec:
  entrypoint: run
  templates:
    - name: run
      inputs:
        parameters:
          - {name: lookback_days, value: "2"}
          - {name: lookahead_days, value: "1"}
          - {name: timezone, value: America/New_York}
      resource:
        action: create
        successCondition: status.succeeded == 1
        failureCondition: status.failed > 0
        manifest: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            generateName: nhl-ingest-
            namespace: lakehouse
            labels:
              app.kubernetes.io/part-of: nhl-lakehouse
              app.kubernetes.io/managed-by: argo-workflows
              workflows.argoproj.io/template: ingest-window
              workflows.argoproj.io/workflow: "{{workflow.name}}"
              nhl-lakehouse/pipeline: scheduled-ingestion
              nhl-lakehouse/component: ingest
          spec:
            ttlSecondsAfterFinished: 60
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: nhl-lakehouse
                  nhl-lakehouse/component: ingest
              spec:
                restartPolicy: Never
                containers:
                  - name: ingest
                    image: ghcr.io/cgoodfred/nhl-lakehouse/ingest:af9a7773470662623b04089aa4c905b3e9446dc9
                    args:
                      - --rolling
                      - --lookback-days={{inputs.parameters.lookback_days}}
                      - --lookahead-days={{inputs.parameters.lookahead_days}}
                      - --timezone={{inputs.parameters.timezone}}
                      - --s3-endpoint=http://seaweedfs-s3.lakehouse.svc.cluster.local:8333
                      - --s3-bucket=nhl-bronze
                    env:
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef: {name: ingest-s3-creds, key: access_key}
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef: {name: ingest-s3-creds, key: secret_key}
                    resources:
                      requests: {cpu: 200m, memory: 128Mi}
                      limits: {cpu: "1", memory: 512Mi}
