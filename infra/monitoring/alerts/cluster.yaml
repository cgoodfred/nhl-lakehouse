groups:
  - name: cluster-health
    interval: 1m
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Monitoring alert delivery is healthy
          description: This continuously firing alert is routed to a null receiver.

      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Kubernetes node {{ $labels.node }} is not ready
          description: The node has reported NotReady continuously for 10 minutes.

      - alert: KubernetesPodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]) >= 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping
          description: Container {{ $labels.container }} has remained in CrashLoopBackOff for 10 minutes.

      - alert: KubernetesPodNotReady
        expr: max by (namespace, pod) (kube_pod_status_ready{condition="true"}) == 0 and on (namespace, pod) max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running|Unknown"}) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
          description: The pod has had no ready containers for 15 minutes.

      - alert: KubernetesJobFailed
        expr: kube_job_status_failed > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kubernetes Job {{ $labels.namespace }}/{{ $labels.job_name }} failed
          description: At least one pod belonging to the Job has failed.

      - alert: MonitoringScrapeTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Monitoring target {{ $labels.job }}/{{ $labels.instance }} is down
          description: OpenTelemetry has been unable to scrape this target for 10 minutes.

  - name: telemetry-pipeline
    interval: 1m
    rules:
      - alert: OpenTelemetryMetricExportFailures
        expr: sum by (exporter) (increase(otelcol_exporter_send_failed_metric_points_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: OpenTelemetry metric export is failing
          description: Exporter {{ $labels.exporter }} has dropped or failed metric points during the last 15 minutes.

      - alert: OpenTelemetryLogExportFailures
        expr: sum by (exporter) (increase(otelcol_exporter_send_failed_log_records_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: OpenTelemetry log export is failing
          description: Exporter {{ $labels.exporter }} has dropped or failed log records during the last 15 minutes.

      - alert: OpenTelemetryTraceExportFailures
        expr: sum by (exporter) (increase(otelcol_exporter_send_failed_spans_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: OpenTelemetry trace export is failing
          description: Exporter {{ $labels.exporter }} has dropped or failed spans during the last 15 minutes.
